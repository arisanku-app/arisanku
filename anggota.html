<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d5b4c">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Arisan Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0d5b4c;--deep:#083d35;--gold:#d9a84e;--gold2:#f0cf8a;--mint:#e8f4ef;--ink:#18332e;--muted:#70827d;--line:#e3ebe7;--serif:'Plus Jakarta Sans',system-ui,sans-serif;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><g fill='none' stroke='%23d9a84e' stroke-opacity='.26'><ellipse cx='30' cy='15' rx='9' ry='15'/><ellipse cx='30' cy='45' rx='9' ry='15'/><ellipse cx='15' cy='30' rx='15' ry='9'/><ellipse cx='45' cy='30' rx='15' ry='9'/></g><g fill='%23d9a84e' fill-opacity='.34'><circle cx='30' cy='30' r='2.4'/><circle cx='0' cy='0' r='2'/><circle cx='60' cy='0' r='2'/><circle cx='0' cy='60' r='2'/><circle cx='60' cy='60' r='2'/></g></svg>")}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:14px 'Plus Jakarta Sans',system-ui,sans-serif;background:#f3f6f4;color:var(--ink);-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}
.wrap{max-width:720px;margin:auto;padding:0 16px calc(50px + env(safe-area-inset-bottom))}
.top{padding:16px 0;display:flex;align-items:center;gap:12px}.top b{font:800 20px var(--serif);display:block;letter-spacing:-.3px}.top small{font-size:10px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}
.lg{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 6px 14px -8px #0d3a2e55}.lg img{width:100%;height:100%;object-fit:cover}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 22px;color:#fff;background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 22px 44px -22px var(--deep);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero:before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:80px;-webkit-mask-image:linear-gradient(100deg,transparent 10%,#000 90%);mask-image:linear-gradient(100deg,transparent 10%,#000 90%)}
.hero:after{content:"";position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff26,#ffffff00 70%);pointer-events:none}.hero>*{position:relative;z-index:1}
.eb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2);font-weight:600}.hero h1{font:800 28px/1.1 var(--serif);margin:8px 0 6px;letter-spacing:-.5px}.hero p{margin:0;color:#c3dcd3;font-size:12.5px;line-height:1.55}
.chip{display:inline-block;margin-top:12px;font-size:11px;background:#ffffff16;border:1px solid #ffffff2a;border-radius:99px;padding:5px 11px;color:#e6f2ee}
.stp{display:inline-block;margin:12px 0 0 8px;transform:rotate(-5deg);border:2px double currentColor;border-radius:7px;padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:1.5px;background:#ffffffee}.stp.l{color:#1b7a4a}.stp.n{color:#c0392b}
.ring{position:relative;width:128px;height:128px;display:grid;place-items:center}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}.ring b{font:800 28px var(--serif);display:block;text-align:center}.ring small{display:block;text-align:center;font-size:9px;letter-spacing:1px;color:#bcd6cc;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 12px 30px -16px #0d3a2e30}.card h2{font:800 18px var(--serif);margin:0 0 4px;letter-spacing:-.2px}.sub{font-size:11.5px;color:var(--muted);margin:0 0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.k{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 12px;position:relative;overflow:hidden}.k:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--gold))}
.k small{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}.k b{display:block;font:800 18px var(--serif);margin-top:8px;color:#183c32}
.sic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--green) 12%,#fff);color:var(--green);font-size:11px;flex:none}
.win{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff7e6,#fff);border:1px solid #f1dcae;border-radius:20px;padding:16px 18px;margin-top:16px}.win .t{font:800 22px var(--serif)}
.rd{display:flex;flex-wrap:wrap;gap:8px}.rd i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--serif);font-style:normal;background:#eef3f0;color:#7c8f88;border:2px solid transparent}
.rd i.w{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#4a3300}.rd i.now{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}.rd i.me{outline:2px dashed var(--gold);outline-offset:2px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}.lgd span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:#dfe7e3}.lgd .g:before{background:var(--gold)}.lgd .n:before{background:#fff;border:2px solid var(--green);width:6px;height:6px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:6px}.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.bc i{display:block;width:100%;max-width:34px;border-radius:99px 99px 8px 8px;background:linear-gradient(180deg,var(--gold),var(--green));min-height:4px}.bc small{font-size:10px;color:var(--muted)}.bc em{font-style:normal;font-size:10px;font-weight:700;color:var(--ink)}
.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed #e1e9e5;align-items:center}.tl li:last-child{border:0}.tl .d{width:38px;height:38px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:700;flex:none;font-size:12px}.tl b{display:block;font-size:13px}.tl small{color:var(--muted);font-size:11px}.tl .r{margin-left:auto;text-align:right}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:10px;background:#eaf5ed;color:#37805b}.tag.p{background:#fff5e4;color:#a87521}
.rek{display:flex;align-items:center;gap:10px;background:var(--mint);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.5;white-space:pre-line}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:12px}input,select{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;color:var(--ink);background:#fff}input:focus,select:focus{outline:2px solid #0d5b4c55;border-color:var(--green)}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 10px 20px -10px var(--green)}.btn:disabled{opacity:.6}
.sec{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:12px;color:#46645a;white-space:nowrap;margin-left:auto}.wa{display:block;text-align:center;text-decoration:none;color:var(--green);font-weight:600;font-size:12.5px;margin-top:14px}
.empty{text-align:center;color:var(--muted);padding:22px 10px}.err{background:#fdecea;color:#b3261e;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:12px}.ok{background:#eaf5ed;color:#2c7a55;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:12px}
.center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.by{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;font-size:11px;color:#7a8aa8}.by svg{height:22px;width:auto;background:#fff;border-radius:6px;padding:2px 5px;border:1px solid #e3ebf7}.by b{color:#0b1f4d}
@media(max-width:520px){.hero{grid-template-columns:1fr;padding:20px 16px}.ring{margin:auto;order:-1}.hero h1{font-size:24px}.k b{font-size:15px}input,select{font-size:16px}.wrap{padding:0 12px 40px}}
.hint{display:block;margin-top:5px;font-size:11px;line-height:1.5;color:#8a9a94}
.req{color:#e5484d;font-weight:700}
.steps2{margin:16px 0 0;padding:12px 14px 12px 32px;background:var(--mint);border-radius:14px;font-size:12.5px;line-height:1.8;color:#35584d}
.illu{width:128px;height:104px;border-radius:18px;background:linear-gradient(165deg,#e6f1ff,#fff);padding:5px;display:grid;place-items:center;box-shadow:0 5px 0 #00000030}.illu img{max-width:100%;max-height:100%;mix-blend-mode:multiply}
.hero.h3{grid-template-columns:1fr auto auto}.applogo{height:30px;width:auto;margin-left:auto;max-width:42%}
@media(max-width:700px){.hero.h3{grid-template-columns:1fr}.hero .illu{display:none}}
.adv2{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}.adv2>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}.adv2[open]>summary{margin-bottom:12px}
/* tanpa motif batik */
:root{--pat:none}
.tag.x{background:#fdecea;color:#b3261e}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Memuat…</div></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
import {SUPABASE_URL,SUPABASE_KEY} from "./supabase-config.js";
const sb=createClient(SUPABASE_URL,SUPABASE_KEY),$=s=>document.querySelector(s),TK=(new URLSearchParams(location.search).get('t')||'').replace(/[^a-f0-9]/gi,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const sh=n=>n>=1e9?'Rp '+(n/1e9).toFixed(2).replace('.',',')+' M':n>=1e6?'Rp '+(n/1e6).toFixed(1).replace('.',',')+' jt':rp(n);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const dark=(h,f)=>{const n=parseInt(h.slice(1),16);return '#'+[n>>16,n>>8&255,n&255].map(c=>Math.round(c*f).toString(16).padStart(2,'0')).join('')};
const wal=n=>{let d=String(n||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d};
const okImg=s=>/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(s||'');
const PN={bulanan:['bulanan','bulan'],mingguan:['mingguan','minggu'],tahunan:['tahunan','tahun']};
const METODE=['Transfer bank','Virtual account','Setor tunai','QRIS'];
function shrink(file,maxW,qual){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',qual))};img.onerror=()=>rej(new Error('File harus berupa gambar (JPG/PNG)'));img.src=u})}
let P=null;
async function load(){
 if(!TK){$('#app').innerHTML='<div class="center">Tautan tidak lengkap. Mintalah tautan pribadi Anda kepada pengurus arisan.</div>';return}
 try{const {data:s,error:er}=await sb.rpc('get_portal',{p_token:TK});if(er)throw er;if(!s){$('#app').innerHTML='<div class="center">Tautan tidak valid atau sudah tidak aktif.<br>Silakan hubungi pengurus arisan.</div>';return}P=s;for(const k of['putaran','jml','menang','iuran','pot'])if(P[k]!=null)P[k]=Number(P[k])||0;P.bayar=(P.bayar||[]).map(x=>({...x,p:Number(x.p)||0,v:Number(x.v)||0}));P.undian=(P.undian||[]).map(x=>({...x,p:Number(x.p)||0}));draw()}
 catch(e){$('#app').innerHTML='<div class="center">Koneksi bermasalah. Periksa internet Anda lalu muat ulang halaman.</div>'}}
function draw(){const w=/^#[0-9a-f]{6}$/i.test(P.warna||'')?P.warna:'#0d5b4c',r=document.documentElement.style;r.setProperty('--green',w);r.setProperty('--deep',dark(w,.62));document.title='Arisan '+P.nama+' — '+P.grup;
 const pn=PN[P.periode]||PN.bulanan,per=pn[1],okS=(P.bayar||[]).filter(x=>x.st=='ok'),sumP=p=>okS.filter(x=>x.p==p).reduce((a,x)=>a+x.v,0),now=sumP(P.putaran),lun=P.iuran>0&&now>=P.iuran,pc=P.iuran?Math.min(100,now/P.iuran*100):0,tot=okS.reduce((a,x)=>a+x.v,0),kurang=Math.max(0,P.iuran-now),R=56,C=2*Math.PI*R;
 const adv=Object.entries(okS.filter(x=>x.p>P.putaran).reduce((m,x)=>(m[x.p]=(m[x.p]||0)+x.v,m),{})).map(a=>[+a[0],a[1]]).sort((a,b)=>a[0]-b[0]),pend=(P.bayar||[]).filter(x=>x.st!='ok'&&x.st!='tolak'&&x.p==P.putaran).reduce((a,x)=>a+x.v,0),und=P.undian||[],mw=und.find(x=>x.p==P.menang);
 let fl=null;try{fl=JSON.parse(localStorage.getItem('kb_'+TK)||'null')}catch(e){}
 const tsum=(P.bayar||[]).reduce((a,x)=>a+x.v,0);
 if(fl&&(tsum>fl.t||Date.now()-fl.at>7*864e5)){try{localStorage.removeItem('kb_'+TK)}catch(e){}fl=null}
 const komit=(P.bayar||[]).filter(x=>x.st=='ok'||x.st=='kirim'||x.st=='pending').reduce((a,x)=>a+x.v,0),sisaW=Math.max(0,P.iuran*P.jml-komit),pcov=P.iuran>0&&pend>0&&now+pend>=P.iuran,lock=!!fl||pcov||lun,
  mbox=lock?`<div class="ok" style="margin:0 0 4px;font-size:13px;line-height:1.55">${fl?'📨 Bukti transfer '+rp(fl.v)+' sudah Anda kirim pada '+fd(fl.tgl)+' dan menunggu konfirmasi pengurus. Tidak perlu mengirim lagi.':pcov?'◷ Setoran Anda sedang menunggu konfirmasi pengurus. Tidak perlu mengirim bukti lagi.':'✓ Iuran putaran ke-'+P.putaran+' sudah lunas. Tidak perlu mengirim bukti lagi.'}</div>`:'';
 const tol=(P.bayar||[]).find(x=>x.st=='tolak'),n=Math.min(60,Math.max(0,+P.jml||0)),ps=[];for(let i=Math.max(1,P.putaran-5);i<=P.putaran;i++)ps.push(i);
 $('#app').innerHTML=`<div class="top"><span class="lg">${okImg(P.logo)?`<img src="${P.logo}" alt="">`:'<span style="color:var(--green)">◉</span>'}</span><div><b>${esc(P.grup)}</b><small>Arisan ${esc(pn[0])}</small></div><img class="applogo" src="logo-arisanku.webp" alt="Arisanku" onerror="this.style.display='none'"></div>
<section class="hero"><div><div class="eb">Selamat datang</div><h1>${esc(P.nama)}</h1><p>Berikut perkembangan iuran dan jadwal undian arisan Anda.</p><span class="chip">Putaran ke-${P.putaran} dari ${P.jml}</span><span class="stp ${lun?'l':'n'}">${lun?'✓ LUNAS':'BELUM LUNAS'}</span></div>
<div class="ring"><svg width="128" height="128" viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="#ffffff22" stroke-width="9"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="#e7bd71" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}"/></svg><div><b>${pc.toFixed(0)}%</b><small>Putaran ini</small></div></div></section>
<section class="grid3"><div class="k"><small><span class="sic">◎</span>Iuran per ${per}</small><b>${sh(P.iuran)}</b></div><div class="k"><small><span class="sic">◔</span>Kurang putaran ini</small><b>${lun?'Lunas':sh(kurang)}</b></div><div class="k"><small><span class="sic">✦</span>Hadiah per putaran</small><b>${sh(P.pot)}</b></div></section>
${tol&&!pend&&!fl&&!lun?`<div class="err" style="margin-top:14px">✕ Bukti transfer ${rp(tol.v)} (${fd(tol.tgl)}) belum dapat diterima pengurus.${tol.al?' Alasan: '+esc(tol.al)+'.':''} Silakan kirim ulang bukti yang jelas di bagian bawah, atau hubungi pengurus.</div>`:''}
${pend?`<div class="ok" style="background:#fff7e6;color:#7d5a14;margin-top:14px">◷ Setoran ${rp(pend)} menunggu konfirmasi pengurus.</div>`:''}
${adv.length?`<div class="ok" style="margin-top:14px">✓ Dibayar di muka: ${adv.map(a=>'putaran ke-'+a[0]+' ('+rp(a[1])+')').join(', ')}.</div>`:''}
<div class="win"><span style="font-size:30px">${P.menang?'🏆':'🎲'}</span><div><small style="color:var(--muted)">Giliran Anda</small><div class="t">${P.menang?`Putaran ke-${P.menang}${mw?' · '+fd(mw.tgl):''}`:'Belum mendapat giliran'}</div></div></div>
${n?`<section class="card"><h2>Peta putaran</h2><p class="sub">Satu lingkaran untuk setiap putaran arisan</p><div class="rd">${Array.from({length:n},(_,i)=>{const p=i+1,w2=und.find(x=>x.p==p);return `<i class="${w2?'w':''} ${p==P.putaran?'now':''} ${p==P.menang?'me':''}" title="Putaran ke-${p}${w2?' · '+esc(w2.nama):''}">${p==P.menang?'★':p}</i>`}).join('')}</div><div class="lgd"><span class="g">Sudah ada pemenang</span><span class="n">Putaran berjalan</span>${P.menang?'<span>★ Giliran Anda</span>':''}</div></section>`:''}
<section class="card"><h2>Setoran saya per putaran</h2><p class="sub">Tinggi batang = persentase iuran yang sudah terkonfirmasi</p><div class="bars">${ps.map(p=>{const s=sumP(p),h=P.iuran?Math.min(100,s/P.iuran*100):0;return `<div class="bc" title="${rp(s)}"><em>${s?sh(s).replace('Rp ',''):'0'}</em><i style="height:${Math.max(3,h*.72)}%"></i><small>#${p}</small></div>`}).join('')}</div></section>
<section class="card"><h2>Daftar pemenang</h2><p class="sub">Hasil undian tiap putaran</p>${und.length?`<ul class="tl">${[...und].sort((a,b)=>a.p-b.p).map(x=>`<li><span class="d">${x.p}</span><span><b>${esc(x.nama)}</b><small>${fd(x.tgl)}</small></span>${x.nama==P.nama?'<span class="r"><span class="tag">Anda</span></span>':''}</li>`).join('')}</ul>`:'<div class="empty">Undian pertama belum dilakukan.</div>'}</section>
<section class="card"><h2>Riwayat iuran saya</h2><p class="sub">Total terkonfirmasi ${rp(tot)}</p>${(P.bayar||[]).length?`<ul class="tl">${P.bayar.slice(0,20).map(x=>`<li><span class="d">${x.st=='kirim'||x.st=='tolak'?'…':x.p}</span><span><b>${rp(x.v)}</b><small>${fd(x.tgl)} · ${esc(x.m)} · ${x.st=='kirim'||x.st=='tolak'?'putaran ditentukan pengurus':'putaran ke-'+x.p}${x.st=='tolak'&&x.al?' · '+esc(x.al):''}</small></span><span class="r"><span class="tag ${x.st=='ok'?'':x.st=='tolak'?'x':'p'}">${x.st=='ok'?'Terkonfirmasi':x.st=='tolak'?'Ditolak':'Menunggu'}</span></span></li>`).join('')}</ul>`:'<div class="empty">Belum ada iuran.</div>'}</section>
<section class="card"><h2>Kirim bukti transfer</h2><p class="sub">Transfer ke rekening berikut, lalu unggah buktinya.</p>
${mbox}${lock?'<details class="adv2"><summary>Tetap ingin mengirim bukti (bayar di muka, atau kirim ulang jika bukti ditolak)</summary>':''}${P.rek?`<div class="rek"><span id="rk" style="flex:1">${esc(P.rek)}</span><button class="sec" id="cp">Salin</button></div>`:'<div class="empty">Rekening belum diatur oleh pengurus.</div>'}
<ol class="steps2"><li>Transfer sesuai nominal ke rekening di atas.</li><li>Isi nominal, tanggal, dan cara bayar di bawah ini.</li><li>Pilih foto atau screenshot bukti transfer, lalu tekan Kirim.</li></ol><form id="f" style="margin-top:16px"><label>Nominal yang Anda transfer (Rp) <span class="req">*</span><input name="v" type="number" inputmode="numeric" min="1" max="${sisaW}" value="${Math.min(kurang||P.iuran,sisaW)||''}" placeholder="mis. ${P.iuran||500000}" required><span class="hint">Isi angka saja, tanpa titik atau koma. ${lun?'Putaran ini sudah lunas; kirim hanya jika Anda membayar putaran lain.':'Kekurangan Anda putaran ini: '+rp(kurang)+'.'} Jika transfer lebih dari kekurangan putaran ini, kelebihannya otomatis masuk ke putaran berikutnya. Sisa kewajiban Anda untuk seluruh arisan: ${rp(sisaW)}.</span></label><label>Tanggal transfer <span class="req">*</span><input name="tgl" type="date" value="${iso(new Date())}" max="${iso(new Date())}" required><span class="hint">Tanggal yang tertera di bukti transfer.</span></label><label>Cara pembayaran <span class="req">*</span><select name="m">${METODE.map(m=>`<option>${m}</option>`).join('')}</select></label><label>Foto bukti transfer <span class="req">*</span><input name="foto" type="file" accept="image/*" required><span class="hint">Pastikan nominal dan tanggal terbaca jelas. Format JPG atau PNG. Putaran iuran ditentukan pengurus saat menerima bukti.</span></label><button class="btn" id="sb">Kirim bukti transfer</button><div id="fm"></div></form>${lock?'</details>':''}
${P.wa?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${wal(P.wa)}?text=${encodeURIComponent('Halo, saya '+P.nama+' ingin bertanya tentang arisan '+P.grup+'.')}">Ada pertanyaan? Hubungi pengurus lewat WhatsApp →</a>`:''}</section>
<div class="by"><svg viewBox="6 16 96 64" role="img" aria-label="BN Software"><path fill="#1a73e8" fill-rule="evenodd" d="M10 22H46C58 22 64 28 64 36C64 41 61 44 58 46C63 48 68 52 68 58C68 68 60 74 48 74H24ZM32 32H46C48 32 50 33 50 36C50 39 48 40 46 40H30ZM30 52H48C50 52 52 53 52 56C52 59 50 61 48 61H28Z"/><path fill="#111a2e" d="M71 24h6l15 24V24h6v50h-6L77 50v24h-6z"/></svg><span>Dibuat oleh <b>BN Software</b></span></div>`;
 const cp=$('#cp');if(cp)cp.onclick=()=>navigator.clipboard?.writeText($('#rk').textContent).then(()=>{cp.textContent='Tersalin ✓';setTimeout(()=>cp.textContent='Salin',2000)});
 $('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),fm=$('#fm'),bt=$('#sb');bt.disabled=true;bt.textContent='Mengirim…';fm.innerHTML='';
  try{if(+f.get('v')>sisaW)throw new Error('Nominal melebihi sisa kewajiban Anda ('+rp(sisaW)+'). Kurangi nominalnya.');let b=await shrink(f.get('foto'),900,.6);if(b.length>380000)b=await shrink(f.get('foto'),640,.5);if(b.length>380000)throw new Error('Foto terlalu besar. Coba foto/screenshot yang lebih kecil.');
   {const {error:er}=await sb.rpc('kirim_bukti',{p_token:TK,p_v:+f.get('v'),p_tgl:f.get('tgl'),p_m:f.get('m'),p_bukti:b});if(er)throw er}
   const nom=+f.get('v'),wl=P.wa?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${wal(P.wa)}?text=${encodeURIComponent('Assalamu’alaikum, saya '+P.nama+' sudah mengirim bukti transfer iuran arisan '+P.grup+' sebesar '+rp(nom)+'. Mohon diverifikasi, terima kasih.')}">Beritahu pengurus lewat WhatsApp →</a>`:'';e.target.reset();fm.innerHTML='<div class="ok">✓ Terima kasih. Bukti transfer terkirim dan menunggu konfirmasi pengurus. Muat ulang halaman nanti untuk melihat statusnya di Riwayat iuran.</div>'+wl;try{localStorage.setItem('kb_'+TK,JSON.stringify({t:(P.bayar||[]).reduce((a,x)=>a+x.v,0),at:Date.now(),v:nom,tgl:iso(new Date())}))}catch(_){}bt.textContent='Terkirim ✓ (menunggu konfirmasi)'}
  catch(x){fm.innerHTML='<div class="err">'+esc(x.code=='P0001'?(x.message||'Gagal mengirim. Hubungi pengurus arisan.'):x.code=='42501'?'Gagal mengirim. Hubungi pengurus arisan.':(x.message||'Gagal mengirim, coba lagi.'))+'</div>';bt.disabled=false;bt.textContent='Kirim bukti transfer'}}}
load();
</script>
</body></html>
